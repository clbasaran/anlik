# XcodeGen yapılandırması.
# Eğer .xcodeproj bozulursa ya da yeniden üretmek isterseniz:
#   brew install xcodegen && xcodegen generate
# komutu ile bu dosyadan birebir proje yeniden oluşturulabilir.
name: SoulmateCoffee
options:
  bundleIdPrefix: com.soulmatecoffee
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  SoulmateCoffee:
    type: application
    platform: iOS
    sources:
      - SoulmateCoffee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulmatecoffee.stok
        INFOPLIST_KEY_CFBundleDisplayName: "Soulmate Stok"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  SoulmateCoffeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SoulmateCoffeeTests
    dependencies:
      - target: SoulmateCoffee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulmatecoffee.stok.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SoulmateCoffee:
    build:
      targets:
        SoulmateCoffee: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoulmateCoffeeTests
